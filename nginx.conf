worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=api:1m rate=3r/s;
  limit_conn_zone $binary_remote_addr zone=api_connections:1m;
  limit_conn_zone $binary_remote_addr zone=ws_connections:1m;
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 2048;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $api_upstream api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:; font-src 'self'" always;
    client_max_body_size 16k;
    location /healthz { proxy_pass http://$api_upstream; }
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      limit_conn api_connections 6;
      proxy_pass http://$api_upstream;
      proxy_read_timeout 60s;
    }
    location /ws/ {
      limit_conn ws_connections 4;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location /vendor/ { expires 30d; }
  }
}
